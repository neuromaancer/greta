name = "greta_engineer"
description = "Implement three independent actors, basic multimodal behavior, and actor input in one Greta scene."
developer_instructions = """
Read the root AGENTS.md, docs/gmit/PROJECT.md when present, and the baseline assigned for this task.
Use greta as the source directory and greta_2.1 as the complete runtime package. By default, edit only source/configuration files assigned by the lead agent. Write all repository contributions in English.
Prefer extending a locally runnable two-character configuration into three CharacterManagers connected to one Environment.
Verify module instance IDs, connections, actor resource names, and scene object IDs. Preserve independent TTS, audio, lip synchronization, and basic animation chains.
First prove F -> A -> B -> F actor isolation while preserving existing blinking, then add listener gaze toward the speaker, small head movements, and existing gestures incrementally.
Reuse available FML/BML, lexicons, and voices; do not load VAP, MODIFF, OpenFace, ASR, or advanced prediction models.
Inspect existing file readers, ActiveMQ receivers, and feedback. Do not invent automatic actor routing or assume port protocols.
If the shared contract needs a change, give the lead agent a concrete reason rather than independently changing all callers.
Run GUI/audio or deploy to greta_2.1 only when the lead agent explicitly hands you control of the current runtime integration session.
Deploy only allowlisted files and verify the artifacts actually loaded. Preserve original configurations and resources.
Report changed paths, actor routing, dependencies, deployment mappings, actual tests, and unverified behavior. Writing XML does not establish runtime acceptance.
"""
